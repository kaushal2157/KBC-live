<div
  [class]="
    'h-screen overflow-hidden flex items-center justify-center px-4 py-6 text-white ' +
    (isTigerTheme
      ? 'bg-gradient-to-br from-amber-950 via-orange-900 to-zinc-900'
      : 'bg-gradient-to-br from-slate-950 via-indigo-950 to-fuchsia-950')
  "
>
  <div class="w-full max-w-xl">
    <div class="rounded-[36px] border border-white/10 bg-white/5 p-6 shadow-2xl backdrop-blur-xl">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-4">
          <img
            [src]="branding.logoPath"
            [alt]="branding.organizationName"
            class="h-20 w-20 rounded-3xl border border-white/10 bg-white/10 p-3 object-contain"
          />
          <div>
            <p class="text-sm uppercase tracking-[0.35em] text-slate-300">
              Quiz completion
            </p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-white">
              {{ branding.heading }}
            </h1>
            <p class="mt-1 text-sm text-slate-300">
              {{ branding.organizationName }}
            </p>
          </div>
        </div>

        <div *ngIf="gameWon || !gameWon" class="mt-4 sm:mt-0">
          <span
            [ngClass]="badgeClass"
            class="inline-flex rounded-full px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em]"
          >
            {{ gameWon ? 'Success' : 'Score' }}
          </span>
        </div>
      </div>

      <div class="mt-10 flex flex-col items-center gap-6 text-center">
        <div class="relative flex h-44 w-44 items-center justify-center rounded-full border-4 border-white/20 bg-white/10 shadow-[0_35px_80px_-40px_rgba(255,255,255,0.8)]">
          <div class="flex h-32 w-32 items-center justify-center rounded-full bg-white/10 text-center">
            <div>
              <p class="text-sm uppercase tracking-[0.35em] text-slate-300">
                Total Score
              </p>
              <p class="mt-3 text-5xl font-semibold text-white">{{ score }}</p>
              <p class="text-sm text-slate-400">of {{ totalQuestions }}</p>
            </div>
          </div>
        </div>

        <div class="max-w-md">
          <p class="text-xl font-semibold text-white">{{ outcomeTitle }}</p>
          <p class="mt-3 text-base leading-7 text-slate-300">
            {{ outcomeMessage }}
          </p>
        </div>
      </div>

      <div class="mt-10 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-3xl bg-gradient-to-r px-5 py-3 text-sm font-semibold text-slate-950 transition hover:brightness-105 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-slate-900"
          [ngClass]="accentGradient"
          (click)="retry.emit()"
        >
          Play another round
        </button>

        <button
          type="button"
          class="inline-flex items-center justify-center rounded-3xl border border-white/20 bg-white/10 px-5 py-3 text-sm font-semibold text-white transition hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-slate-900"
          (click)="gotoContestants.emit()"
        >
          Go to contestants list
        </button>
      </div>
    </div>
  </div>
</div>
