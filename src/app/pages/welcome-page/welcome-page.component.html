<!-- Full-viewport, non-scrollable cinematic welcome screen -->
<div
  class="relative h-screen w-screen overflow-hidden text-gray-100 font-sans select-none bg-[#060606]"
>

  <!-- Radial background grid (Studio-like) -->
  <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] opacity-70"></div>

  <!-- ── Layer 1: Ambient background glows ── -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <div class="gsap-bg-glow absolute -top-[20%] -left-[15%] w-[55%] h-[55%] rounded-full blur-[140px] bg-amber-700"></div>
    <div class="gsap-bg-glow absolute -bottom-[20%] -right-[15%] w-[55%] h-[55%] rounded-full blur-[140px] bg-orange-800"></div>
    <div class="gsap-bg-glow absolute top-[30%] right-[5%]  w-[30%] h-[30%] rounded-full blur-[100px] bg-yellow-900/60"></div>
  </div>

  <!-- Sparkle Particles -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <div *ngFor="let p of particles" class="absolute bg-amber-400 rounded-full sparkle-particle animate-float"
         [style.width.px]="p.size" [style.height.px]="p.size"
         [style.top.%]="p.top" [style.left.%]="p.left"
         [style.animation-duration.s]="p.duration"
         [style.animation-delay.s]="p.delay"
         [style.opacity]="p.opacity">
    </div>
  </div>

  <!-- ── Layer 3: Main content — centered, non-scrollable ── -->
  <div class="relative z-10 h-full flex flex-col items-center justify-center px-6 text-center">

    <!-- Presented By (top label) -->
    <p class="gsap-label text-amber-500/70 tracking-[0.35em] text-[10px] sm:text-xs uppercase font-bold">
      ✦ &nbsp; Presented By &nbsp; ✦
    </p>

    <!-- ── Logo with aura rings ── -->
    <div class="gsap-logo relative flex items-center justify-center">
      <!-- Repeating aura rings (CSS animation) -->
      <div class="aura-ring w-40 h-40 sm:w-52 sm:h-52"></div>
      <div class="aura-ring delay-1 w-40 h-40 sm:w-52 sm:h-52"></div>
      <div class="aura-ring delay-2 w-40 h-40 sm:w-52 sm:h-52"></div>

      <!-- Logo image -->
      <img
        [src]="branding.logoPath"
        [alt]="branding.organizationName"
        class="relative z-10 h-24 sm:h-28 md:h-32 object-contain drop-shadow-2xl"
      />
    </div>

    <!-- School name -->
    <h2 class="gsap-school-name text-lg sm:text-xl md:text-2xl font-bold text-white tracking-wide">
      {{ branding.organizationName }}
    </h2>
    <p class="gsap-tagline text-amber-400/60 text-xs sm:text-sm font-medium italic">
      {{ tagline }}
    </p>

    <!-- ── Main Competition Title ── -->
    <div class="gsap-title relative overflow-visible px-4 py-2">

      <p class="text-amber-500/60 tracking-[0.5em] text-[15px] uppercase font-semibold">
        Competition
      </p>
      <h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black tracking-tighter uppercase leading-[1.2]">
        <span class="block text-white title-small">
          <span class="inline-block animate-word-slide delay-0">Kon</span>
          <span class="inline-block animate-word-slide delay-1 ml-2 sm:ml-4">Banega</span>
        </span>
      </h1>

    </div>

    <!-- Thin separator -->
    <div class="flex items-center gap-3">
      <div class="h-px w-16 bg-gradient-to-r from-transparent to-amber-500/60 rounded-full"></div>
      <div class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></div>
      <div class="h-px w-16 bg-gradient-to-l from-transparent to-amber-500/60 rounded-full"></div>
    </div>

    <!-- GEMS acronym - compact inline, no boxes -->
    <div class="gsap-gems-row flex items-center gap-3 sm:gap-6 md:gap-8 mt-5 sm:mt-6">
      <div *ngFor="let gem of gemsList" class="flex flex-col items-center gap-1">
        <span [class]="'text-3xl sm:text-5xl md:text-6xl font-black animate-gem-glow ' + gem.color">{{ gem.letter }}</span>
        <span class="text-gray-300 text-[10px] sm:text-sm uppercase tracking-widest font-semibold">{{ gem.shortLabel }}</span>
      </div>
    </div>

    <!-- CTA Button -->
    <div class="gsap-cta mt-8 sm:mt-12 md:mt-16">
      <button
        (click)="startQuiz()"
        class="group relative px-12 sm:px-16 py-4 sm:py-5 rounded-full overflow-hidden shadow-2xl transition-transform duration-300 hover:scale-105 active:scale-95"
      >
        <div class="absolute inset-0 bg-gradient-to-r from-amber-500 via-yellow-400 to-orange-500"></div>
        <!-- Sweep shine on hover -->
        <div class="absolute inset-0 -translate-x-full group-hover:translate-x-0 transition-transform duration-500 bg-white/20 skew-x-[-15deg]"></div>
        <span class="relative z-10 text-black font-black text-base sm:text-lg uppercase tracking-widest flex items-center gap-3">
          Begin the Quiz
          <svg class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </span>
      </button>
    </div>

  </div>
</div>
