<div
  [class]="
    'relative min-h-screen text-gray-900 overflow-hidden ' +
    (isTigerTheme ? 'bg-amber-50' : 'bg-white')
  "
>

  <!-- Modern Geometric Background -->
  <div class="absolute inset-0">
    <!-- Light gradient base -->
    <div
      [class]="
        'absolute inset-0 bg-gradient-to-br ' +
        (isTigerTheme
          ? 'from-amber-100 via-orange-50 to-yellow-100'
          : 'from-gray-50 via-blue-50 to-indigo-100')
      "
    ></div>
    
    <!-- Geometric shapes -->
    <!-- <div class="absolute top-20 right-20 w-72 h-72 bg-gradient-to-br from-blue-600/10 to-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-20 left-20 w-96 h-96 bg-gradient-to-tr from-yellow-400/10 to-orange-500/10 rounded-full blur-3xl"></div> -->
    
    <!-- Grid pattern -->
    <!-- <div class="absolute inset-0 opacity-10" 
         style="background-image: linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px); 
                background-size: 50px 50px;"></div> -->

  </div>

  <!-- Navigation Header -->
  <nav class="relative z-10 flex items-center justify-between p-2 max-w-7xl mx-auto">
    <div class="flex items-center gap-6">
      <!-- Pravakta Logo -->
      <div class="flex items-center gap-3 ">
        
          <img [src]="branding.logoPath" [alt]="branding.organizationName" class="w-32 h-full object-contain">
   
      </div>
    </div>
   
    <div class="flex items-center gap-6 shadow-sm ">
      <!-- KBC Logo -->
      <div class="flex items-center gap-3">
        
          <img [src]="branding.kbcLogoPath" alt="KBC Style" class="w-20 h-full object-contain rounded-lg">
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="relative z-10 max-w-6xl mx-auto px-8">
    
    <!-- Hero Section -->
    <div class="text-center">
      
      <!-- Main Title -->
      <!-- <h1 class="md:text-4xl font-black mb-8 tracking-tight">
        <span class="block text-gray-900">Kon Banega English Kaa</span>
        <span class="block bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">Champion</span>
      </h1> -->
            <h1 class="md:text-4xl font-black mb-8 tracking-tight">
        <span [class]="isTigerTheme ? 'block text-amber-950' : 'block text-blue-950'">{{ branding.heading }}</span>
        <span
          [class]="
            'block bg-gradient-to-r bg-clip-text text-transparent ' +
            (isTigerTheme
              ? 'from-amber-700 via-orange-500 to-yellow-600'
              : 'from-red-500 via-yellow-400 to-red-600')
          "
        >
          Champion
        </span>
      </h1>
      
      <!-- Subtitle -->
      <p class="text-xl text-gray-600 mb-12 max-w-3xl mx-auto leading-relaxed">
        Transform your English skills with our intelligent quiz system. 
        Challenge yourself with progressive difficulty levels and smart feedback.
      </p>
      
      <!-- Action Buttons -->
      <!-- <div class="flex flex-col sm:flex-row items-center justify-center">
        <button (click)="startQuiz()" 
          class="bg-gray-900 hover:bg-gray-800 text-white font-semibold py-4 px-8 rounded-2xl
                 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105
                 flex items-center gap-3 text-lg">
          Begin Quiz
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div> -->
            <div class="flex flex-col sm:flex-row items-center justify-center">
        <button
          (click)="startQuiz()"
          [class]="
            'text-white font-semibold py-4 px-8 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center gap-3 text-lg ' +
            (isTigerTheme ? 'bg-amber-600 hover:bg-amber-700' : 'bg-red-600 hover:bg-red-700')
          "
        >
          Begin Quiz
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
