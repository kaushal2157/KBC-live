<div class="min-h-screen bg-gradient-to-b from-purple-900 via-blue-900 to-black py-8 px-4">
        <div class="absolute top-0 right-4 md:right-8">
        <img src="pravakta-logo.png" alt="Organization Logo" class="w-14 h-14 md:w-18 md:h-18 object-contain">
      </div>
  <div class="max-w-7xl mx-auto">
    
    <!-- Header Section -->
    <div class="text-center mb-10 relative">
      <!-- Organization Logo (Top Right) -->


      <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-yellow-300 to-yellow-500 mb-3 animate-pulse">
        Kaun Banega English Ka Champion
      </h1>
      <h2 class="text-xl md:text-2xl text-yellow-400 font-semibold mb-2">
        Choose Your Contestant
      </h2>
      <div class="w-24 h-1 bg-gradient-to-r from-transparent via-yellow-400 to-transparent mx-auto"></div>
    </div>

    <!-- Contestants Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 max-w-7xl mx-auto">
      <div *ngFor="let contestant of contestants; let i = index"
           (click)="selectContestant(contestant)"
           class="group cursor-pointer relative overflow-hidden
                  bg-gradient-to-br from-indigo-900/50 via-purple-900/50 to-blue-900/50
                  border-2 border-yellow-500/30
                  rounded-xl p-4
                  hover:border-yellow-400 hover:shadow-xl hover:shadow-yellow-500/50
                  transform hover:scale-105 hover:-translate-y-1
                  transition-all duration-300 ease-out">
        
        <!-- Animated Background Effect -->
        <div class="absolute inset-0 bg-gradient-to-br from-yellow-400/0 via-yellow-400/0 to-yellow-400/0 
                    group-hover:from-yellow-400/10 group-hover:via-purple-400/10 group-hover:to-blue-400/10 
                    transition-all duration-500"></div>
        
        <!-- Corner Accent -->
        <div class="absolute top-0 right-0 w-10 h-10 bg-yellow-400/20 rounded-bl-full"></div>
        
        <!-- Content -->
        <div class="relative z-10">
          <!-- Avatar/ID Circle - Smaller -->
          <div class="w-14 h-14 mx-auto mb-2
                      rounded-full bg-gradient-to-br from-yellow-400 to-orange-500
                      flex items-center justify-center
                      shadow-lg shadow-yellow-500/50
                      group-hover:shadow-yellow-400/70 group-hover:scale-110
                      transition-all duration-300
                      border-3 border-white/20">
            <span class="text-xl font-black text-purple-900">
              {{ contestant.id }}
            </span>
          </div>

          <!-- Name - Smaller -->
          <h3 class="text-sm font-bold text-yellow-300 text-center mb-2 
                     group-hover:text-yellow-200 transition-colors
                     line-clamp-1">
            {{ contestant.name }}
          </h3>

          <!-- Stats Badge - Compact -->
          <div class="flex items-center justify-center gap-1 
                      bg-black/30 rounded-full px-2 py-1
                      border border-yellow-500/30">
            <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
              <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
            </svg>
            <span class="text-xs font-semibold text-gray-300">
              {{ contestant.questions.length }}
            </span>
          </div>

          <!-- Play Icon on Hover - Smaller -->
          <div class="mt-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <div class="flex items-center justify-center gap-1 text-yellow-400 font-semibold">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
              </svg>
              <span class="text-xs">Play</span>
            </div>
          </div>
        </div>

        <!-- Shine Effect -->
        <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
          <div class="absolute top-0 -left-full h-full w-1/2 bg-gradient-to-r from-transparent via-white/10 to-transparent 
                      transform group-hover:left-full transition-all duration-1000 ease-in-out"></div>
        </div>
      </div>
    </div>

    <!-- Empty State (if no contestants) -->
    <div *ngIf="contestants.length === 0" class="text-center py-16">
      <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-yellow-500/10 flex items-center justify-center">
        <svg class="w-10 h-10 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </div>
      <h3 class="text-xl font-bold text-yellow-400 mb-2">No Contestants Yet</h3>
      <p class="text-gray-400 text-sm">Contestants will appear here once they're added</p>
    </div>
  </div>
</div>
